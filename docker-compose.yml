services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile # added on feature/madvith-backend-core
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - storage_data:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile # added on feature/sameeksha-frontend-app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  storage_data:
